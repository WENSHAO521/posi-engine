name: Crossref probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          echo '[{"posi_id":"L1","title":"The Lancet","issn_online":"0099-5355","issn_print":"0140-6736","issns":["0099-5355","0140-6736","1474-547X"]},{"posi_id":"N1","title":"Nature","issn_online":"0028-0836","issn_print":"1476-4687","issns":["0028-0836","1476-4687"]}]' > c.json
          mkdir -p o/journals
          # A done file as the old code wrote it: fetched under the dead ISSN.
          echo '{"posi_id":"L1","issn_queried":"0099-5355","fetch_status":200,"enumerated_count":0,"works_fetched":0,"pcs":null}' > o/journals/L1.json
          echo '{"posi_id":"N1","issn_queried":"0028-0836","fetch_status":200,"enumerated_count":10,"works_fetched":10,"pcs":1}' > o/journals/N1.json
          node scripts/run-pcs-etl.mjs --corpus c.json --out o --recheck-issns --rows 1000 | grep -v '^  "' | head -40
          for f in o/journals/*.json; do echo "$f"; node -e "const d=require('./$f');console.log(d.issn_queried,d.enumerated_count,d.pcs,JSON.stringify(d.issn_window_counts))"; done
