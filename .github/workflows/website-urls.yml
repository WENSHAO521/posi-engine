name: Refresh website URLs

# Finds corpus records whose website_url no longer leads anywhere (or that
# have none) and replaces them with the first candidate that answers: the
# journal's OpenAlex homepage_url, its Wikidata official website (by ISSN),
# or Wiley's ISSN address (scripts/refresh-website-urls.mjs). Run by hand before a
# large evidence crawl. The change arrives as a pull request on posi-data
# (branch website-urls/<date>-<corpus>-<run id>) with the full report in its run's artifact
# and the job summary;
# nothing changes until it is reviewed and merged.
#
# Needs the POSI_DATA_TOKEN secret (see ajr-rerate.yml).

on:
  workflow_dispatch:
    inputs:
      corpus:
        description: 'posi-data corpus file'
        default: 'corpus/global-benchmark.json'
      only_rateable:
        description: 'Only journals AJR can rate today (Early-Stage or Mature)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check out posi-data
        uses: actions/checkout@v4
        with:
          repository: WENSHAO521/posi-data
          path: posi-data
          token: ${{ secrets.POSI_DATA_TOKEN }}

      # Inputs reach the shell only as environment variables, never pasted
      # into the script (a crafted value must not run commands with the
      # posi-data token).
      - name: Check website URLs
        env:
          CORPUS: ${{ inputs.corpus }}
          ONLY_RATEABLE: ${{ inputs.only_rateable }}
        run: |
          set -euo pipefail
          case "$CORPUS" in corpus/*.json) ;; *) echo "::error::corpus must be corpus/<name>.json"; exit 1 ;; esac
          FLAG=""; [ "$ONLY_RATEABLE" = "true" ] && FLAG="--only-rateable"
          node scripts/refresh-website-urls.mjs \
            --corpus "posi-data/$CORPUS" --out "posi-data/$CORPUS" \
            --report work/website-urls $FLAG
          cat work/website-urls/website-urls.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-urls
          path: work/

      - name: Open a pull request on posi-data
        env:
          GH_TOKEN: ${{ secrets.POSI_DATA_TOKEN }}
          CORPUS: ${{ inputs.corpus }}
        working-directory: posi-data
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No website URL changed"; exit 0
          fi
          DAY=$(date -u +%Y-%m-%d)
          # One branch per run: a second run never overwrites a pending one.
          BRANCH="website-urls/$DAY-$(basename "$CORPUS" .json)-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$CORPUS"
          git commit -m "Refresh website URLs ($DAY, $CORPUS)"
          git push --force origin "$BRANCH"
          node -e '
            const r = require("../work/website-urls/website-urls.json")
            const changed = r.rows.filter(x => x.action === "add" || x.action === "replace")
            const dead = r.rows.filter(x => x.action === "dead_no_replacement")
            const lines = [
              `Website URLs refreshed (OpenAlex homepage_url, Wikidata official website by ISSN, Wiley ISSN address) by posi-engine [refresh-website-urls](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}).`,
              "", "```json", JSON.stringify(r.counts, null, 2), "```", "",
              `### Changed (${changed.length})`, "", "| Journal | Was | Now | Source | Why |", "|---|---|---|---|---|",
              ...changed.map(x => `| ${x.posi_id} ${x.title} | ${x.current ?? "–"} | ${x.url} | ${x.source} | ${x.reason} |`),
              "", `### Dead, no replacement (${dead.length})`, "", "| Journal | Address | Why |", "|---|---|---|",
              ...dead.map(x => `| ${x.posi_id} ${x.title} | ${x.current} | ${x.reason} |`),
            ]
            require("fs").writeFileSync("../pr-body.md", lines.join("\n").slice(0, 60000))
          '
          if [ "$(gh pr list --head "$BRANCH" --state open --json number -q length)" = "0" ]; then
            gh pr create --head "$BRANCH" --base "$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)" \
              --title "Refresh website URLs ($DAY, $CORPUS)" --body-file ../pr-body.md
          else
            gh pr edit "$BRANCH" --body-file ../pr-body.md
          fi
