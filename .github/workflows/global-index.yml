name: Global index and rankings

# Automated GLOBAL-INDEX-1.0 cycle (posi-data/GLOBAL-INDEX-1.0-SPEC.md):
# harvest every Crossref and OpenAlex journal, compute PCS-1.0 for each, build
# the PCS-Q ranking edition, once a month.
#
# Schedule: runs on the 1st, 2nd and 3rd of each month. The 1st starts the
# month's cycle and normally finishes it (8 PCS shards take about two hours
# for ~158,000 journals); the 2nd and 3rd only resume a cycle that did not
# finish, and otherwise exit within minutes. A new cycle starts when the
# last one is at least 20 days old, i.e. on the next month's 1st. (The
# actions cache drops entries unused for 7 days, so a cycle must finish
# within these three days; between months the work directory starts fresh.)
#
# Each run has three jobs:
#   prepare  advances harvest and corpus (resumable), releases the corpus
#   pcs      8 parallel shards, each computing PCS for its share of the
#            journals (run-pcs-etl.mjs --shard i/8); journals already done
#            are skipped, and a shard that runs out of time resumes next run
#   finish   merges the shards into the work directory, builds the PCS-Q
#            edition once every journal is done, and releases it
# The work directory is kept in the actions cache between runs.
#
# Results are published as releases of THIS repository (tag global-index-<cycle>):
#   - global-corpus.json.gz as soon as the corpus exists (journal directory),
#     with openalex-profiles.jsonl.gz (journal profile pages)
#   - the PCS-Q edition, summaries and PCS shards when the cycle completes
# posi-data imports them on its own schedule, so no cross-repository token is
# needed here.
#
# OpenAlex journals come from the public OpenAlex snapshot (no API budget).
# OPENALEX_API_KEY is used for the per-journal PCS work lookups.

on:
  schedule:
    - cron: '30 1 1-3 * *'   # 1st-3rd of each month, 01:30 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: 'Harvest limit per source (testing only; empty = everything)'
        required: false
        default: ''

concurrency:
  group: global-index
  cancel-in-progress: false

permissions:
  contents: write   # releases on this repository

env:
  SHARDS: 8

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      stage: ${{ steps.cycle.outputs.stage }}
      cycle: ${{ steps.cycle.outputs.cycle }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check out posi-data (read only, for curated records)
        uses: actions/checkout@v4
        with:
          repository: WENSHAO521/posi-data
          path: posi-data

      - name: Restore work directory
        uses: actions/cache/restore@v4
        with:
          path: work
          key: global-index-${{ github.run_id }}
          restore-keys: global-index-

      # PCS itself runs in the pcs shards below; here the pcs stage only
      # counts what is done (and moves on to ranking when everything is).
      - name: Advance the cycle
        id: cycle
        env:
          POSI_MAILTO: posi@panorama-sg.com
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          node scripts/global/run-cycle.mjs \
            --work work \
            --curated posi-data/corpus/core-collection.json \
            --curated posi-data/corpus/global-benchmark.json \
            --budget-minutes 320 \
            --cycle-days 20 \
            --no-pcs-fetch \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      # The journal directory only needs the corpus, so it is released as soon
      # as the corpus exists (PCS for every journal comes later).
      - name: Release the journal corpus
        if: steps.cycle.outputs.corpus_ready == 'true'
        env:
          CYCLE: ${{ steps.cycle.outputs.cycle }}
        run: |
          set -euo pipefail
          TAG="global-index-$CYCLE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists"
          else
            gzip -kf work/global-corpus.json
            PROFILES=""
            if [ -f work/openalex-profiles.jsonl ]; then gzip -kf work/openalex-profiles.jsonl; PROFILES=work/openalex-profiles.jsonl.gz; fi
            gh release create "$TAG" work/global-corpus.json.gz work/global-corpus.json.summary.json $PROFILES \
              --title "Global index $CYCLE" \
              --notes "GLOBAL-INDEX-1.0 cycle $CYCLE. Journal corpus released; the PCS-Q edition is added when the cycle completes."
          fi

      # Only when every journal was already done before this run.
      - name: Release the ranking edition
        if: steps.cycle.outputs.publish == 'true'
        env:
          CYCLE: ${{ steps.cycle.outputs.cycle }}
        run: scripts/global/release-edition.sh

      - name: Mark cycle published
        if: steps.cycle.outputs.publish == 'true'
        run: node scripts/global/run-cycle.mjs --work work --mark-published

      - name: Save work directory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work
          key: global-index-${{ github.run_id }}-prepare

  pcs:
    needs: prepare
    if: needs.prepare.outputs.stage == 'pcs'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore work directory
        uses: actions/cache/restore@v4
        with:
          path: work
          key: global-index-${{ github.run_id }}-prepare
          fail-on-cache-miss: true

      # Stops starting new journals after 310 minutes; the rest resume next run.
      - name: Compute PCS for shard ${{ matrix.shard }}
        env:
          POSI_MAILTO: posi@panorama-sg.com
        run: |
          touch "$RUNNER_TEMP/start"
          node scripts/run-pcs-etl.mjs \
            --corpus work/global-corpus.json \
            --out work/pcs \
            --shard ${{ matrix.shard }}/$SHARDS \
            --concurrency 4 \
            --budget-minutes 310 \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      # Only what this shard wrote: finished journals and mid-journal checkpoints.
      - name: Pack results
        if: always()
        run: |
          find work/pcs -type f -newer "$RUNNER_TEMP/start" ! -name summary.json ! -name per-journal-pcs.csv > "$RUNNER_TEMP/files" || true
          echo "$(wc -l < "$RUNNER_TEMP/files") files"
          tar -czf pcs-shard.tar.gz -T "$RUNNER_TEMP/files"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcs-shard-${{ matrix.shard }}
          path: pcs-shard.tar.gz
          retention-days: 3

  finish:
    needs: [prepare, pcs]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.stage == 'pcs'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore work directory
        uses: actions/cache/restore@v4
        with:
          path: work
          key: global-index-${{ github.run_id }}-prepare
          fail-on-cache-miss: true

      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: pcs-shard-*
          path: shards

      - name: Merge shard results
        run: |
          for f in shards/*/pcs-shard.tar.gz; do tar -xzf "$f"; done
          echo "$(ls work/pcs/journals | wc -l) journals with PCS"
          node scripts/global/summarize-pcs.mjs --pcs-dir work/pcs > /dev/null

      - name: Advance the cycle
        id: cycle
        run: node scripts/global/run-cycle.mjs --work work --budget-minutes 90 --no-pcs-fetch

      - name: Release the ranking edition
        if: steps.cycle.outputs.publish == 'true'
        env:
          CYCLE: ${{ steps.cycle.outputs.cycle }}
        run: scripts/global/release-edition.sh

      - name: Mark cycle published
        if: steps.cycle.outputs.publish == 'true'
        run: node scripts/global/run-cycle.mjs --work work --mark-published

      - name: Save work directory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work
          key: global-index-${{ github.run_id }}
