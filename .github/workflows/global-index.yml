name: Global index and rankings

# Automated GLOBAL-INDEX-1.0 cycle (posi-data/GLOBAL-INDEX-1.0-SPEC.md):
# harvest every Crossref and OpenAlex journal, compute PCS-1.0 for each, build
# the PCS-Q ranking edition. A full cycle takes several daily runs; each run
# advances as far as its time budget allows and resumes from the cached work
# directory. A new cycle starts every 30 days after the previous one finished.
#
# Results are published as releases of THIS repository (tag global-index-<cycle>):
#   - global-corpus.json.gz as soon as the corpus exists (journal directory)
#   - the PCS-Q edition, summaries and PCS shards when the cycle completes
# posi-data imports them on its own schedule, so no cross-repository token is
# needed here.
#
# OpenAlex journals come from the public OpenAlex snapshot (no API budget).
# OPENALEX_API_KEY is used for the per-journal PCS work lookups.

on:
  schedule:
    - cron: '30 1 * * *'   # daily, 01:30 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: 'Harvest limit per source (testing only; empty = everything)'
        required: false
        default: ''

concurrency:
  group: global-index
  cancel-in-progress: false

permissions:
  contents: write   # releases on this repository

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check out posi-data (read only, for curated records)
        uses: actions/checkout@v4
        with:
          repository: WENSHAO521/posi-data
          path: posi-data

      - name: Restore work directory
        uses: actions/cache/restore@v4
        with:
          path: work
          key: global-index-${{ github.run_id }}
          restore-keys: global-index-

      - name: Advance the cycle
        id: cycle
        env:
          POSI_MAILTO: posi@panorama-sg.com
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          node scripts/global/run-cycle.mjs \
            --work work \
            --curated posi-data/corpus/core-collection.json \
            --curated posi-data/corpus/global-benchmark.json \
            --budget-minutes 320 \
            --concurrency 4 \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      # The journal directory only needs the corpus, so it is released as soon
      # as the corpus exists (PCS for every journal takes several more runs).
      - name: Release the journal corpus
        if: steps.cycle.outputs.corpus_ready == 'true'
        env:
          CYCLE: ${{ steps.cycle.outputs.cycle }}
        run: |
          set -euo pipefail
          TAG="global-index-$CYCLE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists"
          else
            gzip -kf work/global-corpus.json
            gh release create "$TAG" work/global-corpus.json.gz work/global-corpus.json.summary.json \
              --title "Global index $CYCLE" \
              --notes "GLOBAL-INDEX-1.0 cycle $CYCLE. Journal corpus released; the PCS-Q edition is added when the cycle completes."
          fi

      - name: Release the ranking edition
        if: steps.cycle.outputs.publish == 'true'
        env:
          CYCLE: ${{ steps.cycle.outputs.cycle }}
        run: |
          set -euo pipefail
          TAG="global-index-$CYCLE"
          mkdir -p out
          cp work/pcs-q/pcs-q-*.json work/pcs-q/pcs-q-*.csv out/
          cp work/pcs-q/summary.json out/pcs-q-summary.json
          cp work/pcs/summary.json out/pcs-summary.json
          cp work/cycle.json out/cycle.json
          tar -czf out/pcs-shards.tar.gz -C work/pcs pcs
          gh release upload "$TAG" out/* --clobber
          gh release edit "$TAG" --notes "GLOBAL-INDEX-1.0 cycle $CYCLE, posi-engine $(git rev-parse HEAD). Complete: journal corpus and PCS-Q edition."

      - name: Mark cycle published
        if: steps.cycle.outputs.publish == 'true'
        run: node scripts/global/run-cycle.mjs --work work --mark-published

      - name: Save work directory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work
          key: global-index-${{ github.run_id }}
