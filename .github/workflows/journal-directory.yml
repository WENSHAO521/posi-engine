name: Weekly journal directory

# Refreshes the journal corpus and OpenAlex profiles once a week. The
# ranking (global-index.yml) runs once a year, at the start of December, and
# only its cycle harvests journals, so without this the journal directory
# would miss the year's new journals.
#
# The OpenAlex journal list comes from the API with the project's
# OPENALEX_API_KEY (about 1,300 list requests), so journals OpenAlex added
# since its last monthly snapshot are included; without the key it falls back
# to the snapshot. The journal pages' figures are refreshed daily on their own
# (openalex-profiles.yml).
#
# Schedule: Monday to Wednesday. Monday normally finishes the refresh;
# Tuesday and Wednesday resume one that did not, and otherwise exit at once.
#
# Output: a release tagged journals-<Monday's date> with global-corpus.json.gz,
# its summary and openalex-profiles.jsonl.gz. The site build (sync-live-data.mjs
# in Panorama-Open-Scholarly-Index) uses the newest journals-* or
# global-index-* release, and the site rebuilds daily. posi-data imports only
# global-index-* releases, so these do not touch the rankings. Only the newest
# four journals-* releases are kept, so the other workflows' release lookups
# (the newest 30 releases) still reach the global-index-* ones.

on:
  schedule:
    - cron: '30 2 * * 1-3'   # Monday to Wednesday, 02:30 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: 'Harvest limit per source (testing only; empty = everything)'
        required: false
        default: ''
      force:
        description: 'Run even if this week already has a corpus release'
        type: boolean
        default: false
      continuation:
        description: 'Set by automatic continuation runs (scripts/global/continue-run.sh); leave at 0'
        required: false
        default: '0'
      prev_progress:
        description: 'Set by automatic continuation runs; leave empty'
        required: false
        default: ''

concurrency:
  group: journal-directory
  cancel-in-progress: false

permissions:
  contents: write   # releases on this repository
  issues: write     # alerts
  actions: write    # start the next run when one stops with work left

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if this week already has a corpus release
        id: check
        run: |
          set -euo pipefail
          # The week is named by its Monday.
          PERIOD=$(date -u -d "-$(( $(date -u +%u) - 1 )) days" +%F)
          echo "period=$PERIOD" >> "$GITHUB_OUTPUT"
          TAGS=$(gh release list --limit 50 --json tagName -q '.[].tagName')
          if [ "${{ inputs.force || false }}" != "true" ] && echo "$TAGS" | grep -Eq "^(journals-$PERIOD|global-index-$PERIOD)$"; then
            echo "A corpus release for the week of $PERIOD exists; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: '20'

      - name: Check out posi-data (read only, for curated records)
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: WENSHAO521/posi-data
          path: posi-data

      - name: Restore work directory
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: dir-work
          key: journal-directory-${{ github.run_id }}
          restore-keys: journal-directory-

      - name: Refresh the corpus
        id: refresh
        if: steps.check.outputs.skip != 'true'
        env:
          POSI_MAILTO: posi@panorama-sg.com
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          LIMIT: ${{ inputs.limit }}
          PERIOD: ${{ steps.check.outputs.period }}
        run: |
          [[ -z "$LIMIT" || "$LIMIT" =~ ^[0-9]+$ ]] || { echo "limit must be a whole number" >&2; exit 1; }
          node scripts/global/refresh-directory.mjs \
            --work dir-work \
            --period "$PERIOD" \
            --curated posi-data/corpus/core-collection.json \
            --curated posi-data/corpus/global-benchmark.json \
            --budget-minutes 320 \
            ${LIMIT:+--limit "$LIMIT"}

      - name: Release the journal corpus
        if: steps.refresh.outputs.corpus_ready == 'true' && inputs.limit == ''
        env:
          PERIOD: ${{ steps.refresh.outputs.month }}
        run: |
          set -euo pipefail
          TAG="journals-$PERIOD"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists"
          else
            gzip -kf dir-work/global-corpus.json
            PROFILES=""
            if [ -f dir-work/openalex-profiles.jsonl ]; then gzip -kf dir-work/openalex-profiles.jsonl; PROFILES=dir-work/openalex-profiles.jsonl.gz; fi
            COUNT=$(node -e 'console.log(require("./dir-work/global-corpus.json").length)')
            gh release create "$TAG" dir-work/global-corpus.json.gz dir-work/global-corpus.json.summary.json $PROFILES \
              --title "Journal directory, week of $PERIOD" \
              --notes "Weekly journal directory refresh ($COUNT journals). Journal corpus and OpenAlex profiles only; rankings are released separately as global-index-* when a ranking cycle completes."
          fi
          # Keep the newest four weekly releases (the list is newest first).
          for t in $(gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^journals-' | tail -n +5); do
            gh release delete "$t" --yes --cleanup-tag
          done

      - name: Alert if the refresh is unfinished on Wednesday
        if: github.event_name == 'schedule' && steps.check.outputs.skip != 'true' && steps.refresh.outputs.stage != 'done'
        run: |
          if [ "$(date -u +%u)" -ge 3 ]; then
            scripts/global/alert.sh "The weekly journal directory refresh is not finished after its last scheduled run (stage: ${{ steps.refresh.outputs.stage }}). Run the Weekly journal directory workflow by hand to finish it from the cached progress."
          fi

      - name: Alert on failure
        if: failure()
        run: scripts/global/alert.sh "The weekly journal directory refresh failed."

      - name: Save work directory
        if: always() && steps.check.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: dir-work
          key: journal-directory-${{ github.run_id }}

      # Stopped at the time budget with the harvest or corpus unfinished:
      # start the next run now (it resumes from the saved work directory)
      # rather than waiting for tomorrow's schedule. At most 4 in a row.
      - name: Continue automatically
        if: always() && steps.refresh.outcome == 'success' && steps.refresh.outputs.stage != 'done'
        env:
          CONTINUATION: ${{ inputs.continuation || '0' }}
          PROGRESS: ${{ steps.refresh.outputs.stage }}
          SAME_OK: 'true'
          MAX_CONTINUATIONS: '4'
          EXTRA_INPUTS: >-
            ${{ inputs.force && 'force=true' || '' }}
            ${{ inputs.limit && format('limit={0}', inputs.limit) || '' }}
        run: scripts/global/continue-run.sh journal-directory.yml "The weekly journal directory refresh (stage ${{ steps.refresh.outputs.stage }})"
