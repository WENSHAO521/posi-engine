name: Monthly journal directory

# Refreshes the journal corpus and OpenAlex profiles once a month. The
# ranking (global-index.yml) runs once a year, at the start of December, and
# only its cycle harvests journals, so without this the journal directory
# would miss eleven months of new journals a year.
#
# Schedule: the 4th to 6th of each month. The 4th normally finishes the
# refresh; the 5th and 6th resume one that did not, and otherwise exit at
# once. A month whose corpus a global-index release already carries (the
# December ranking) is skipped.
#
# Output: a release tagged journals-<YYYY-MM> with global-corpus.json.gz, its
# summary and openalex-profiles.jsonl.gz. The site build (sync-live-data.mjs
# in Panorama-Open-Scholarly-Index) uses the newest journals-* or
# global-index-* release, and the site rebuilds daily. posi-data imports only
# global-index-* releases, so these do not touch the rankings.

on:
  schedule:
    - cron: '30 2 4-6 * *'   # 4th-6th of each month, 02:30 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: 'Harvest limit per source (testing only; empty = everything)'
        required: false
        default: ''
      force:
        description: 'Run even if this month already has a corpus release'
        type: boolean
        default: false
      continuation:
        description: 'Set by automatic continuation runs (scripts/global/continue-run.sh); leave at 0'
        required: false
        default: '0'
      prev_progress:
        description: 'Set by automatic continuation runs; leave empty'
        required: false
        default: ''

concurrency:
  group: journal-directory
  cancel-in-progress: false

permissions:
  contents: write   # releases on this repository
  issues: write     # alerts
  actions: write    # start the next run when one stops with work left

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if this month already has a corpus release
        id: check
        run: |
          set -euo pipefail
          MONTH=$(date -u +%Y-%m)
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"
          TAGS=$(gh release list --limit 50 --json tagName -q '.[].tagName')
          if [ "${{ inputs.force || false }}" != "true" ] && echo "$TAGS" | grep -Eq "^(journals-$MONTH|global-index-$MONTH-[0-9]{2})$"; then
            echo "A corpus release for $MONTH exists; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: '20'

      - name: Check out posi-data (read only, for curated records)
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: WENSHAO521/posi-data
          path: posi-data

      - name: Restore work directory
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: dir-work
          key: journal-directory-${{ github.run_id }}
          restore-keys: journal-directory-

      - name: Refresh the corpus
        id: refresh
        if: steps.check.outputs.skip != 'true'
        env:
          POSI_MAILTO: posi@panorama-sg.com
          LIMIT: ${{ inputs.limit }}
        run: |
          [[ -z "$LIMIT" || "$LIMIT" =~ ^[0-9]+$ ]] || { echo "limit must be a whole number" >&2; exit 1; }
          node scripts/global/refresh-directory.mjs \
            --work dir-work \
            --curated posi-data/corpus/core-collection.json \
            --curated posi-data/corpus/global-benchmark.json \
            --budget-minutes 320 \
            ${LIMIT:+--limit "$LIMIT"}

      - name: Release the journal corpus
        if: steps.refresh.outputs.corpus_ready == 'true' && inputs.limit == ''
        env:
          MONTH: ${{ steps.refresh.outputs.month }}
        run: |
          set -euo pipefail
          TAG="journals-$MONTH"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists"
          else
            gzip -kf dir-work/global-corpus.json
            PROFILES=""
            if [ -f dir-work/openalex-profiles.jsonl ]; then gzip -kf dir-work/openalex-profiles.jsonl; PROFILES=dir-work/openalex-profiles.jsonl.gz; fi
            COUNT=$(node -e 'console.log(require("./dir-work/global-corpus.json").length)')
            gh release create "$TAG" dir-work/global-corpus.json.gz dir-work/global-corpus.json.summary.json $PROFILES \
              --title "Journal directory $MONTH" \
              --notes "Monthly journal directory refresh ($COUNT journals). Journal corpus and OpenAlex profiles only; rankings are released separately as global-index-* when a ranking cycle completes."
          fi

      - name: Alert if the refresh is unfinished on the 6th
        if: github.event_name == 'schedule' && steps.check.outputs.skip != 'true' && steps.refresh.outputs.stage != 'done'
        run: |
          if [ "$(date -u +%d)" -ge 6 ]; then
            scripts/global/alert.sh "The monthly journal directory refresh is not finished after its last scheduled run (stage: ${{ steps.refresh.outputs.stage }}). Run the Monthly journal directory workflow by hand within 7 days to finish it from the cached progress."
          fi

      - name: Alert on failure
        if: failure()
        run: scripts/global/alert.sh "The monthly journal directory refresh failed."

      - name: Save work directory
        if: always() && steps.check.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: dir-work
          key: journal-directory-${{ github.run_id }}

      # Stopped at the time budget with the harvest or corpus unfinished:
      # start the next run now (it resumes from the saved work directory)
      # rather than waiting for tomorrow's schedule. At most 4 in a row.
      - name: Continue automatically
        if: always() && steps.refresh.outcome == 'success' && steps.refresh.outputs.stage != 'done'
        env:
          CONTINUATION: ${{ inputs.continuation || '0' }}
          PROGRESS: ${{ steps.refresh.outputs.stage }}
          SAME_OK: 'true'
          MAX_CONTINUATIONS: '4'
          EXTRA_INPUTS: >-
            ${{ inputs.force && 'force=true' || '' }}
            ${{ inputs.limit && format('limit={0}', inputs.limit) || '' }}
        run: scripts/global/continue-run.sh journal-directory.yml "The monthly journal directory refresh (stage ${{ steps.refresh.outputs.stage }})"
